<!DOCTYPE html>
<html>
<head>
    <title>Compus Bites - Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Compus Bites</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="checkout.html">Checkout</a>
    </nav>
</header>

<main>
    <h2>Checkout</h2>

    <form onsubmit="placeOrder(event)">

        <label>Customer Name:</label><br>
        <input type="text" id="customerName" required><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" id="phone" required><br><br>

        <label>Delivery Location:</label><br>
        <input type="text" id="location" required><br><br>

        <h3 id="orderTotal">Total: KSh 0</h3>

        <button type="submit">Confirm Order</button>

    </form>
</main>

<footer>
    <p>&copy; 2026 Compus Bites</p>
</footer>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let total = cart.reduce((sum, item) => sum + item.price, 0);

document.getElementById("orderTotal").innerText =
    "Total: KSh " + total;

function placeOrder(event) {
    event.preventDefault();

    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    alert("Thank you! Your order has been received.");

    localStorage.removeItem("cart");
    window.location.href = "index.html";
}
</script>

</body>
</html>
